<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Tarefas Porto · Admin</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c1d2b;--mute:#6b6f85;--line:#e4e6f0;--pri:#4f46e5;--pri-ink:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#eef0f8;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1017;--card:#181a25;--ink:#eceef7;--mute:#9297b0;--line:#2a2d3d;--pri:#818cf8;--pri-ink:#0f1017;--chip:#232636;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
h1{font-size:20px;margin:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;cursor:pointer;min-height:40px}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:600}
.btn.sm{padding:4px 11px;min-height:34px;font-size:13.5px}
.btn.bad{color:var(--bad);border-color:var(--bad)}
input[type=text],input[type=password],input[type=search]{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;width:100%;min-height:44px}
.muted{color:var(--mute);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{display:block;font-size:26px;line-height:1.1}
@media(max-width:520px){.tiles{grid-template-columns:repeat(3,1fr)}.tile{padding:10px}.tile b{font-size:22px}.top .muted{display:none}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:6px 13px;cursor:pointer;min-height:36px}
.chip[aria-pressed=true]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.dev{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.dev:first-child{border-top:0}
.name{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600}
.b-ativo{background:rgba(22,163,74,.15);color:var(--ok)}
.b-pendente{background:rgba(217,119,6,.15);color:var(--warn)}
.b-bloqueado{background:rgba(220,38,38,.15);color:var(--bad)}
.meta{color:var(--mute);font-size:13px;display:flex;gap:4px 14px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.sw{display:flex;align-items:center;gap:12px;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked{background:var(--ok)}.sw input:checked::after{transform:translateX(20px)}
#login{max-width:360px;margin:18vh auto 0}
.err{color:var(--bad);min-height:1.4em;margin:8px 0 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" hidden class="card">
    <h1 style="margin-bottom:4px">Admin</h1><p class="muted" style="margin:0 0 14px">Tarefas Porto</p>
    <form id="lf"><input type="password" id="pw" placeholder="Palavra-passe" autocomplete="current-password" required>
    <p class="err" id="lerr" role="alert"></p><button class="btn pri" style="width:100%">Entrar</button></form>
  </div>
  <div id="painel" hidden>
    <div class="top"><h1 class="grow">Aparelhos</h1><span class="muted" id="upd"></span><a class="btn sm" href="/api/admin/backup" download style="text-decoration:none;display:inline-flex;align-items:center">Exportar</a><button class="btn sm" id="atualizar">Atualizar</button><button class="btn sm" id="sair">Sair</button></div>
    <div class="tiles" id="tiles"></div>
    <div class="card"><label class="sw"><input type="checkbox" id="aprov"><span><b>Exigir aprovação de aparelhos novos</b><br><span class="muted">Desligado: entram logo. Ligado: ficam «pendentes» até os aprovares. Os que já existem não são afetados.</span></span></label></div>
    <div class="card"><b>Nomes das pessoas</b><p class="muted" style="margin:2px 0 10px">Mudam para todos os aparelhos.</p>
      <form id="nf" class="row" style="align-items:flex-end"><div id="nomes" class="row grow" style="flex-wrap:wrap"></div><button class="btn pri">Guardar nomes</button></form><p class="err" id="nerr" role="status" style="color:var(--ok)"></p></div>
    <div class="card">
      <div class="row" style="margin-bottom:6px"><div class="chips" id="filtros"></div><div class="grow"></div></div>
      <input type="search" id="q" placeholder="Procurar…" style="margin:8px 0 4px">
      <div id="lista"></div>
    </div>
    <div class="card"><b>Atividade recente</b><div id="ativ" style="margin-top:6px"></div></div>
  </div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null,filtro='todos',timer=null,armado=null;
async function api(p,corpo){
  const r=await fetch(p,corpo===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'fetch'},body:JSON.stringify(corpo)});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&!p.endsWith('/login')){mostrarLogin();throw new Error('sessao')}
  if(!r.ok)throw new Error(j.erro||'Erro '+r.status);
  return j;
}
function mostrarLogin(){clearInterval(timer);$('#painel').hidden=true;$('#login').hidden=false;$('#pw').focus()}
async function carregar(){
  try{D=await api('/api/admin/dados');D.ativ=(await api('/api/admin/atividade')).itens;$('#login').hidden=true;$('#painel').hidden=false;desenhar()}
  catch(e){if(e.message!=='sessao'){$('#lerr').textContent=e.message;mostrarLogin()}}
}
function rel(t){const s=Math.max(0,(D.agora-t)/1000);if(s<90)return 'agora mesmo';if(s<3600)return 'há '+Math.round(s/60)+' min';if(s<86400)return 'há '+Math.round(s/3600)+' h';return 'há '+Math.round(s/86400)+' d'}
function data(t){return new Date(t).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function desenhar(){
  const A=D.aparelhos,n=(f)=>A.filter(f).length;
  $('#upd').textContent='atualizado '+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('#aprov').checked=!!D.config.aprovacao;
  if(!$('#nomes').contains(document.activeElement))$('#nomes').innerHTML=D.pessoas.map((n,i)=>`<label style="flex:1 1 130px;min-width:0"><span class="muted">Pessoa ${i+1}</span><input type="text" maxlength="20" value="${esc(n)}" data-n="${i}" required></label>`).join('');
  $('#ativ').innerHTML=D.ativ.length?D.ativ.slice(0,40).map(h=>`<div class="dev"><div><b>${esc(h.quem)}</b> ${esc(h.texto)}</div><div class="meta"><span>${rel(h.t)}</span></div></div>`).join(''):'<p class="muted">Ainda sem atividade.</p>';
  $('#tiles').innerHTML=[['Aparelhos',A.length],['Online agora',n(a=>D.agora-a.ultimo<5*60e3)],['Ativos hoje',n(a=>D.agora-a.ultimo<864e5)],['Instalados',n(a=>a.instalada)],['Pendentes',n(a=>a.status==='pendente')],['Bloqueados',n(a=>a.status==='bloqueado')]]
    .map(([l,v])=>`<div class="tile"><b>${v}</b><span class="muted">${l}</span></div>`).join('');
  const fs=[['todos','Todos'],['pendente','Pendentes'],['ativo','Ativos'],['bloqueado','Bloqueados']];
  $('#filtros').innerHTML=fs.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${filtro===k}">${l}</button>`).join('');
  const q=$('#q').value.trim().toLowerCase();
  const L=A.filter(a=>(filtro==='todos'||a.status===filtro)&&(!q||[a.etiqueta,a.pessoa,a.plataforma,a.id].join(' ').toLowerCase().includes(q)));
  $('#lista').innerHTML=L.length?L.map(a=>{
    const on=D.agora-a.ultimo<5*60e3;
    return `<div class="dev" data-id="${esc(a.id)}"><div class="name">${on?'<span class="dot" title="online"></span>':''}${esc(a.etiqueta||a.pessoa||'Sem nome')}<span class="badge b-${a.status}">${a.status}</span></div>
      <div class="meta"><span>👤 ${esc(a.pessoa||'ninguém escolhido')}</span><span>📱 ${esc(a.plataforma)}${a.instalada?' · instalada':' · no browser'}</span><span>Visto ${rel(a.ultimo)}</span><span>${a.visitas} visita${a.visitas===1?'':'s'}</span><span>1.º acesso ${data(a.primeiro)}</span><span>ID …${esc(a.id.slice(-6))}</span></div>
      <div class="acts">${a.status==='pendente'?'<button class="btn sm pri" data-a="aprovar">Aprovar</button>':''}${a.status==='bloqueado'?'<button class="btn sm" data-a="desbloquear">Desbloquear</button>':''}${a.status!=='bloqueado'?'<button class="btn sm" data-a="bloquear">Bloquear</button>':''}<button class="btn sm" data-a="etiqueta">Renomear</button><button class="btn sm bad" data-a="apagar">${armado===a.id?'Confirmar apagar':'Apagar'}</button></div></div>`}).join('')
    :'<p class="muted" style="padding:18px 0;text-align:center">Nenhum aparelho.</p>';
}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#lerr').textContent='';
  try{await api('/api/admin/login',{password:$('#pw').value});$('#pw').value='';await carregar();timer=setInterval(carregar,20000)}
  catch(err){$('#lerr').textContent=err.message}};
$('#nf').onsubmit=async e=>{e.preventDefault();$('#nerr').textContent='';
  try{await api('/api/admin/pessoas',{pessoas:[...document.querySelectorAll('#nomes input')].map(i=>i.value)});$('#nerr').textContent='Guardado.';await carregar()}
  catch(err){$('#nerr').style.color='var(--bad)';$('#nerr').textContent=err.message}};
$('#atualizar').onclick=()=>carregar();
$('#sair').onclick=async()=>{try{await api('/api/admin/logout',{})}catch(e){}mostrarLogin()};
$('#aprov').onchange=async e=>{try{await api('/api/admin/config',{aprovacao:e.target.checked});await carregar()}catch(err){alert(err.message);await carregar()}};
$('#q').oninput=desenhar;
document.addEventListener('click',async e=>{
  const f=e.target.closest('[data-f]');if(f){filtro=f.dataset.f;desenhar();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const id=b.closest('.dev').dataset.id,acao=b.dataset.a;
  try{
    if(acao==='apagar'){if(armado!==id){armado=id;desenhar();return}armado=null}
    let valor;
    if(acao==='etiqueta'){valor=prompt('Nome deste aparelho (ex.: Telemóvel da Sofia):',(D.aparelhos.find(a=>a.id===id)||{}).etiqueta||'');if(valor===null)return}
    await api('/api/admin/aparelho',{id,acao,valor});await carregar();
  }catch(err){alert(err.message)}
});
carregar().then(()=>{if(!$('#painel').hidden)timer=setInterval(carregar,20000)});
</script>
</body>
</html>
