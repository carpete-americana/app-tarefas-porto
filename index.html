<!doctype html>
<html lang="pt-PT">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M18 34l10 10 20-22' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c1d2b;--mute:#6b6f85;--line:#e4e6f0;--pri:#4f46e5;--pri-ink:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
--p0:#0d9488;--p1:#d97706;--p2:#7c3aed;--chip:#eef0f8;--shadow:0 1px 2px rgba(20,20,50,.06),0 4px 14px rgba(20,20,50,.05);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1017;--card:#181a25;--ink:#eceef7;--mute:#9297b0;--line:#2a2d3d;--pri:#818cf8;--pri-ink:#0f1017;--chip:#232636;--p0:#2dd4bf;--p1:#fbbf24;--p2:#a78bfa;--shadow:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1017;--card:#181a25;--ink:#eceef7;--mute:#9297b0;--line:#2a2d3d;--pri:#818cf8;--pri-ink:#0f1017;--chip:#232636;--p0:#2dd4bf;--p1:#fbbf24;--p2:#a78bfa;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1100px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) 0 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top h1{font-size:20px;margin:0;flex:1;min-width:140px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);gap:4px}
nav.tabs button{flex:1;background:none;border:0;border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mute);cursor:pointer}
nav.tabs button .i{font-size:19px;line-height:1}
nav.tabs button[aria-current=page]{color:var(--pri);background:var(--chip);font-weight:600}
@media(min-width:760px){nav.tabs{position:static;background:none;border:0;padding:0;order:3;width:100%;gap:6px}nav.tabs button{flex:0 0 auto;flex-direction:row;gap:6px;padding:8px 14px;font-size:14px;border:1px solid var(--line);background:var(--card)}nav.tabs button[aria-current=page]{border-color:var(--pri)}.app{padding-bottom:40px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2,.card h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;cursor:pointer;min-height:38px}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed=true]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.item{display:flex;align-items:flex-start;flex-wrap:wrap;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item label{flex:1 1 0}
.ph{width:26px;flex:none}
.cnt{border:1px solid var(--line);background:var(--chip);color:var(--mute);border-radius:99px;padding:4px 11px;min-height:32px;font-size:13px;cursor:pointer;flex:none;align-self:center}
.cnt[aria-expanded=true]{color:var(--ink);border-color:var(--pri)}
.item:first-of-type{border-top:0}
.item input[type=checkbox],label.row input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;flex:none;border:2px solid var(--mute);border-radius:8px;background:var(--card);cursor:pointer;display:grid;place-content:center;transition:background .15s,border-color .15s}
.item input[type=checkbox]::after,label.row input[type=checkbox]::after{content:"";width:12px;height:7px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .12s}
.item input[type=checkbox]:checked,label.row input[type=checkbox]:checked{background:var(--ok);border-color:var(--ok)}
.item input[type=checkbox]:checked::after,label.row input[type=checkbox]:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.item input[type=checkbox]:focus-visible,label.row input[type=checkbox]:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.item label{flex:1;cursor:pointer;min-width:0}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.t{display:block}.s{display:block;color:var(--mute);font-size:12.5px}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--mute);margin-left:4px}
.days{display:flex;gap:6px;flex-basis:100%;margin:0 0 4px 36px;flex-wrap:wrap}
.days button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--chip);font-size:13px;font-weight:600;cursor:pointer;color:var(--mute);padding:0}
.days button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.days button.today{outline:2px solid var(--pri);outline-offset:1px}
.days button.off{opacity:.4;cursor:default}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}
tr.now td{background:var(--chip)}
select,input[type=text],input[type=date],input[type=month],textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 9px;max-width:100%}
select.sm{padding:3px 6px;font-size:13px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:18px;width:min(480px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
.row>.f{flex:1 1 220px;min-width:0}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;max-width:100%;min-height:44px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:left}
input[type=text]{min-height:44px}
.f{display:grid;gap:4px;margin-bottom:11px;min-width:0}.f label{font-size:12.5px;color:var(--mute)}
.f input,.f select,.f textarea{width:100%}
.empty{text-align:center;padding:26px 8px;color:var(--mute)}
.big{font-size:26px;font-weight:700}
.wk{display:flex;align-items:center;gap:8px}
header.top{gap:6px 12px}
.sub{flex-basis:100%;order:2;min-width:0}
.sub:empty{display:none}
.sub .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sub .chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;min-height:36px}
details.pcard{padding:0}
details.pcard>summary{list-style:none;cursor:pointer;padding:14px}
details.pcard>summary::-webkit-details-marker{display:none}
details.pcard>summary .chev{transition:transform .2s;color:var(--mute)}
details.pcard[open]>summary .chev{transform:rotate(90deg)}
details.pcard>.body{padding:0 14px 12px}
@media(max-width:759px){header.top h1{font-size:18px}.big{font-size:22px}.item{padding:11px 0}.card{padding:12px}.grid3{gap:10px}.btn{min-height:42px}}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
#gate .box{max-width:440px;margin:0 auto}
#gate img{width:72px;height:72px;border-radius:16px;display:block;margin:0 auto 14px}
#gate h1{font-size:22px;text-align:center;margin:0 0 6px}
#gate p.lead{text-align:center;color:var(--mute);margin:0 0 18px}
#gate ol{margin:0;padding:0;list-style:none;counter-reset:p}
#gate li{counter-increment:p;display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
#gate li::before{content:counter(p);flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri);color:var(--pri-ink);font-weight:700;display:grid;place-content:center;font-size:14px}
#gate .btn{width:100%;margin-top:14px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;cursor:pointer;color:var(--mute);font-weight:600;min-height:40px}
.seg button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:#1c1d2b;color:#fff;border-radius:12px;padding:10px 10px 10px 16px;display:flex;gap:12px;align-items:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:#a5b4fc;font-weight:700;cursor:pointer;padding:6px 6px;min-height:36px}
@media(min-width:760px){#toast{bottom:24px}}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
.ativ .quem{font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header class="top"><h1>🏠 Tarefas Porto</h1><div id="sub" class="sub"></div>
    <nav class="tabs" id="tabs"></nav></header>
  <main id="main"></main>
</div>
<div id="gate" hidden></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script src="textos.js"></script>
<script>
'use strict';
/* ---------- helpers ---------- */
const COMMON=['Cozinha','Sala','Casa de banho'];
const REPEATS=['daily','w2','w1','need','wday','once'];
const KEY='tarefas-porto-v1';
const TKEY='tarefas-porto-tema',VERSAO='29/09/2026';
function temaAtual(){try{return localStorage.getItem(TKEY)||'auto'}catch(e){return 'auto'}}
function aplicarTema(k){const r=document.documentElement;if(k==='light'||k==='dark')r.setAttribute('data-theme',k);else r.removeAttribute('data-theme');try{localStorage.setItem(TKEY,k)}catch(e){}}
aplicarTema(temaAtual());
function haQuanto(t){const m=Math.max(0,(Date.now()-t)/60000);if(m<1.5)return TP('tempo.agora');if(m<60)return TP('tempo.min',{n:Math.round(m)});if(m<1440)return TP('tempo.h',{n:Math.round(m/60)});return TP('tempo.d',{n:Math.round(m/1440)})}
const mod=(a,n)=>((a%n)+n)%n;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---------- textos (o admin pode mudar todos; os originais vêm de textos.js) ---------- */
const TKEYS='tarefas-porto-textos';
const TDEF=Object.fromEntries((window.TEXTOS_DEF||[]).map(d=>[d.k,d.v]));
let TOV={};try{TOV=JSON.parse(localStorage.getItem(TKEYS)||'{}')||{}}catch(e){TOV={}}
let tvSrv=-1;
function tRaw(k){let v=TOV[k]!==undefined?TOV[k]:TDEF[k];if(Array.isArray(v))v=v.length?v[Math.floor(Math.random()*v.length)]:'';return v==null?k:String(v)}
// T: HTML seguro (escapa, **negrito**; variáveis escapadas, menos as que acabam em Html). TP: texto simples.
function T(k,vars){return esc(tRaw(k)).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\{(\w+)\}/g,(m,n)=>vars&&vars[n]!==undefined?(/Html$/.test(n)?String(vars[n]):esc(vars[n])):m)}
function TP(k,vars){return tRaw(k).replace(/\{(\w+)\}/g,(m,n)=>vars&&vars[n]!==undefined?String(vars[n]):m)}
const dC=i=>TP('dia.c'+i),dL=i=>TP('dia.l'+i);
function aplicarTitulo(){const h=document.querySelector('header h1');if(h)h.textContent=TP('app.emoji')+' '+TP('app.nome');document.title=TP('app.nome')}
async function carregarTextos(){
  if(!/^https?:$/.test(location.protocol))return;
  try{const r=await fetch('/api/textos',{cache:'no-store'});if(!r.ok)return;const j=await r.json();
    TOV=j.textos||{};tvSrv=j.tv;try{localStorage.setItem(TKEYS,JSON.stringify(TOV))}catch(e){}
    if(typeof renderSeguro==='function'&&bloqueado===false&&estadoServ==='ativo')renderSeguro()}catch(e){}
}
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dow=d=>mod(d.getDay()+6,7);
const mondayOf=d=>addDays(d,-dow(d));
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const dm=d=>d.toLocaleDateString('pt-PT',{day:'numeric',month:'short'});
const monthName=d=>{const s=d.toLocaleDateString('pt-PT',{month:'long',year:'numeric'});return s[0].toUpperCase()+s.slice(1)};
const uid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- estado ---------- */
function defaultTasks(){
  const T=(room,title,repeat,who,note='')=>({id:uid(),room,title,repeat,who,note,active:true});
  return [
   T('Cozinha','Lavar/arrumar loiça e deixar bancada limpa','daily','rota','Responsável pela cozinha'),
   T('Cozinha','Limpar placa/fogão e mesa/balcão','daily','rota','Após utilização / fim do dia'),
   T('Cozinha','Varrer ou aspirar o chão','w2','rota','Ex.: seg., qua., sáb.'),
   T('Cozinha','Lavar o chão','w1','rota','Preferencialmente ao fim de semana'),
   T('Cozinha','Limpar micro-ondas, exterior do frigorífico e frentes dos armários','w1','rota'),
   T('Sala','Arrumar objetos, mantas e almofadas','daily','rota','Manter superfícies livres'),
   T('Sala','Limpar pó de móveis e superfícies','w1','rota'),
   T('Sala','Aspirar o chão/tapete','w1','rota'),
   T('Sala','Lavar o chão','w1','rota','Se aplicável'),
   T('Quartos','Fazer/organizar camas e roupa fora do lugar','daily','quartos','Cada pessoa trata do quarto que ocupa nesse mês'),
   T('Quartos','Limpar pó de móveis e mesas de cabeceira','w1','quartos','Ocupante(s) do quarto nesse mês'),
   T('Quartos','Aspirar o chão','w1','quartos','Quarto partilhado: responsabilidade dos dois ocupantes'),
   T('Quartos','Mudar roupa de cama','w1','quartos','Cada pessoa trata da sua cama'),
   T('Casa de banho','Limpar sanita, lavatório e espelho','w1','rota'),
   T('Casa de banho','Limpar duche/banheira','w1','rota'),
   T('Casa de banho','Aspirar/varrer e lavar o chão','w1','rota'),
   T('Casa de banho','Repor papel higiénico e verificar sabonete','need','rota'),
  ];
}
function freshState(){
  return {people:['Sofia','Leonor','Francisco'],anchor:fmt(mondayOf(today())),roomsBase:'2026-10',
    trashOn:true,tasks:defaultTasks(),done:{},ov:{}};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S||!Array.isArray(S.tasks))S=freshState();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const FKEY='tarefas-porto-filtro';
let f0=-1;try{const v=localStorage.getItem(FKEY);f0=v===null?-1:Number(v);if(!Number.isInteger(f0)||f0<-1||f0>=S.people.length)f0=-1}catch(e){f0=-1}
const ui={tab:'hoje',week:mondayOf(today()),filter:f0,open:{},dayOpen:{},sub:'lista',q:'',room:'todas',ativ:null};
const PCOL=i=>`var(--p${i%3})`;
const who=i=>S.people[i]??'?';

/* ---------- rotações ---------- */
const anchor=()=>mondayOf(parse(S.anchor));
const weekAbs=mon=>Math.round((mon-anchor())/(7*864e5));
const weekNo=mon=>mod(weekAbs(mon),3)+1;
function respRoom(room,mon){
  const o=S.ov[`${fmt(mon)}|${room}`];if(o!==undefined)return o;
  return mod(COMMON.indexOf(room)+weekAbs(mon),3);
}
const TRASH_DAYS=[0,2,4,6];
function respTrash(date){
  const o=S.ov['lixo|'+fmt(date)];if(o!==undefined)return o;
  const mon=mondayOf(date),k=TRASH_DAYS.indexOf(dow(date));
  return mod(weekAbs(mon)*4+k,3);
}
function roomsMonth(date){ // {ind: pessoa do quarto individual, shared:[2 pessoas]}
  const [by,bm]=S.roomsBase.split('-').map(Number);
  const m=mod((date.getFullYear()*12+date.getMonth())-(by*12+bm-1),3);
  return {ind:m,shared:[0,1,2].filter(x=>x!==m)};
}

/* ---------- ocorrências ---------- */
function personsFor(t,mon,date){
  if(t.who==='rota')return COMMON.includes(t.room)?[respRoom(t.room,mon)]:[0,1,2];
  if(t.who==='quartos'||t.who==='todos')return [0,1,2];
  if(t.who==='rodar'){let h=0;for(const c of String(t.id))h+=c.charCodeAt(0);return [mod(weekAbs(mon)+h,3)]}
  const n=Number(t.who);return n<S.people.length?[n]:[];
}
function genWeek(mon){
  const out=[],days=[...Array(7)].map((_,i)=>addDays(mon,i));
  const push=(t,p,date,slot,kind,extra={})=>{
    const rota=t.who==='rota';
    out.push({key:`${t.id}|${kind==='day'?fmt(date):fmt(mon)}|${slot}${rota?'':'|'+p}`,t,p,date,kind,slot,
      optional:t.repeat==='need',...extra});
  };
  for(const t of S.tasks){
    if(!t.active)continue;
    const ps=personsFor(t,mon);
    const qnote=p=>{if(t.who!=='quartos')return '';const r=roomsMonth(mon);
      return r.ind===p?TP('semana.subInd'):TP('semana.subPartilhado',{nome:who(r.shared.find(x=>x!==p))})};
    for(const p of ps){
      const ex={sub:qnote(p)};
      if(t.repeat==='daily')days.forEach(d=>push(t,p,d,0,'day',ex));
      else if(t.repeat==='w1'||t.repeat==='need')push(t,p,null,0,'week',ex);
      else if(t.repeat==='w2'){push(t,p,null,0,'week',ex);push(t,p,null,1,'week',ex)}
      else if(t.repeat==='wday'){const d=days[mod(Number(t.weekday||0),7)];push(t,p,d,0,'day',ex)}
      else if(t.repeat==='once'&&t.date){const d=parse(t.date);if(fmt(mondayOf(d))===fmt(mon))push(t,p,d,0,'day',ex)}
    }
  }
  if(S.trashOn){
    const Tl={id:'lixo',title:TP('lixo.titulo'),room:'Lixo',who:'rota',repeat:'wday'};
    TRASH_DAYS.forEach(k=>{const d=days[k];out.push({key:'lixo|'+fmt(d),t:Tl,p:respTrash(d),date:d,kind:'day',slot:0,sub:'',trash:true})});
  }
  return out;
}
const isDone=o=>!!S.done[o.key];
function progress(list){const c=list.filter(o=>!o.optional);const d=c.filter(isDone).length;return {d,n:c.length,pct:c.length?Math.round(d/c.length*100):0}}
const bar=p=>`<div class="bar" role="progressbar" aria-valuenow="${p.pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p.pct}%"></i></div>`;

/* ---------- vistas ---------- */
function itemRow(o,{showPerson=false,showDay=false}={}){
  const d=isDone(o);
  const tags=[];
  if(showPerson)tags.push(`<span class="tag"><span class="dot" style="background:${PCOL(o.p)}"></span>${esc(who(o.p))}</span>`);

function subStats(){
  const now=today(),mon0=mondayOf(now),a0=anchor();
  const sem=[0,1,2,3].map(i=>{const mon=addDays(mon0,-7*i),occ=genWeek(mon);return {i,mon,occ,ok:mon>=a0,pp:S.people.map((n,p)=>progress(occ.filter(o=>o.p===p)))}});
  const tot=S.people.map((n,p)=>{let d=0,nn=0;sem.filter(x=>x.ok).forEach(x=>{d+=x.pp[p].d;nn+=x.pp[p].n});return {d,n:nn,pct:nn?Math.round(d/nn*100):0}});
  const cards=S.people.map((n,p)=>`<div class="card" style="border-top:4px solid ${PCOL(p)}"><div class="row"><h3 class="grow" style="margin:0"><span class="dot" style="background:${PCOL(p)}"></span>${esc(n)}</h3><b>${tot[p].n?tot[p].pct+'%':'—'}</b></div>${bar(tot[p])}
    <p class="muted" style="margin:8px 0 4px">${T('stats.ultimas',{d:tot[p].d,n:tot[p].n})}${tot[p].n?' · <b>'+esc(fraseNota(tot[p].pct))+'</b>':''}</p>
    ${sem.map(x=>`<div class="row" style="justify-content:space-between;padding:3px 0;font-size:14px"><span>${dm(x.mon)} – ${dm(addDays(x.mon,6))}${x.i===0?` <span class="tag">${T('tag.atual')}</span>`:''}</span><span>${x.ok?x.pp[p].d+'/'+x.pp[p].n:'—'}</span></div>`).join('')}</div>`).join('');
  const tarde=[],diarias=S.people.map(()=>0);

    if(o.kind==='day'&&o.date<now){if(diaria)diarias[o.p]++;else tarde.push(o)}

   <div class="card"><h3>${T('stats.atraso')}</h3>${tarde.length?tarde.slice(0,40).map(o=>itemRow(o,{showPerson:true,showDay:true})).join('')+(tarde.length>40?`<p class="muted">${T('stats.maisN',{n:tarde.length-40})}</p>`:''):`<div class="empty" style="padding:14px">${T('stats.nadaAtraso')}</div>`}
   <p class="muted" style="margin:8px 0 0">${diarias.some(n=>n)?T('stats.diarias')+S.people.map((n,p)=>diarias[p]?esc(n)+' '+diarias[p]:'').filter(Boolean).join(' · ')+'. ':''}${T('stats.rodape')}</p></div>`;
}

async function carregarAtividade(){

  try{
    const r=await fetch('/api/atividade?id='+encodeURIComponent(id),{cache:'no-store'});
    if(r.ok)ui.ativ=(await r.json()).itens;else if(ui.ativ===null)ui.ativ=[];
  }catch(e){if(ui.ativ===null)ui.ativ=[]}
  if(ui.tab==='tarefas'&&ui.sub==='ativ')renderSeguro();

  f.onsubmit=e=>{e.preventDefault();
    let w=f.who.value;if(!['rota','quartos','todos','rodar'].includes(w))w=Number(w);
    if(w==='rota'&&!COMMON.includes(f.room.value.trim())){alert(TP('dlg.erroRota'));return}
    const nt={...t,title:f.title.value.trim(),room:f.room.value.trim(),who:w,repeat:f.repeat.value,note:f.note.value.trim(),date:f.date.value,weekday:Number(f.weekday.value)};
    if(!nt.title)return;
    if(nt.id){S.tasks=S.tasks.map(x=>x.id===nt.id?nt:x)}else{nt.id=uid();S.tasks.push(nt)}
    save();$dlg.close();render();op({op:'tarefa',tarefa:nt})};
  $dlg.showModal();
}

/* ---------- render / eventos ---------- */
const $dlg=document.getElementById('dlg'),$main=document.getElementById('main');
const TABS=[['hoje',viewHoje],['semana',viewSemana],['rot',viewRot],['tarefas',viewTarefas],['mais',viewMais]];
let desfazer=null,toastT=null;
function toast(msg,undo){const t=document.getElementById('toast');desfazer=undo||null;t.innerHTML=`<span>${esc(msg)}</span>${undo?`<button data-act="undo">${T('toast.desfazer')}</button>`:''}`;t.className='on';clearTimeout(toastT);toastT=setTimeout(()=>{t.className='';desfazer=null},8000)}
async function procurarAtualizacao(){
  try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}
    if(window.caches){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}
  location.reload();
}
function textoSinc(){
  if(!comRede())return TP('sinc.local');
  if(fila.length)return (fila.length===1?TP('sinc.fila1'):TP('sinc.filaN',{n:fila.length}))+(semRede?TP('sinc.semRedeFila'):'.');
  if(semRede)return TP('sinc.semRede');
  return ultimaSync?TP('sinc.ok',{quando:haQuanto(ultimaSync)}):TP('sinc.nunca');
}
function render(){
  aplicarTitulo();
  document.getElementById('tabs').innerHTML=TABS.map(([k])=>`<button data-act="tab" data-t="${k}" ${ui.tab===k?'aria-current="page"':''}><span class="i">${T('nav.'+k+'.i')}</span>${T('nav.'+k)}</button>`).join('');
  document.getElementById('sub').innerHTML=(ui.tab==='hoje'||ui.tab==='semana')?filterChips():'';
  const v=TABS.find(t=>t[0]===ui.tab)[1];
  const y=window.scrollY;$main.innerHTML=v();window.scrollTo(0,y);
  if(ui.tab==='mais')pintarPush();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(b.tagName==='SELECT'||b.tagName==='INPUT'&&b.type!=='checkbox'&&a!=='toggle')return;
  if(a==='tab'){ui.tab=b.dataset.t;window.scrollTo(0,0);render()}
  else if(a==='filter'){ui.filter=Number(b.dataset.i);try{localStorage.setItem(FKEY,ui.filter)}catch(e){}render();hello()}
  else if(a==='wk'){const d=Number(b.dataset.d);ui.week=d===0?mondayOf(today()):addDays(ui.week,7*d);render()}
  else if(a==='toggle'){const k=b.dataset.k;if(S.done[k])delete S.done[k];else S.done[k]=1;save();render();op({op:'marcar',chave:k,valor:!!S.done[k]})}
  else if(a==='days'){const k=b.dataset.dk;ui.dayOpen[k]=!ui.dayOpen[k];render()}
  else if(a==='sub'){ui.sub=b.dataset.k;render()}
  else if(a==='room'){ui.room=b.dataset.r;render()}
  else if(a==='tema'){aplicarTema(b.dataset.k);render()}
  else if(a==='sincNow'){versaoSrv=-1;sincronizar().then(()=>setTimeout(()=>{if(ui.tab==='mais')renderSeguro()},400))}
  else if(a==='atualizar')procurarAtualizacao();
  else if(a==='pushOn'){ativarPush().then(()=>pintarPush())}
  else if(a==='pushOff'){desativarPush().then(()=>pintarPush())}
  else if(a==='pushTeste'){testarPush()}
  else if(a==='undo'){const f=desfazer;desfazer=null;document.getElementById('toast').className='';if(f)f()}
  else if(a==='restaurar'){const faltam=defaultTasks().filter(d=>!S.tasks.some(t=>t.title===d.title&&t.room===d.room));faltam.forEach(t=>{S.tasks.push(t);op({op:'tarefa',tarefa:t})});save();render();toast(faltam.length?(faltam.length===1?TP('toast.restauradas1'):TP('toast.restaurasN',{n:faltam.length})):TP('toast.nadaRestaurar'))}
  else if(a==='dupTask'){const t=S.tasks.find(x=>x.id===b.dataset.id);if(t){const c={...t,id:uid(),title:(t.title+TP('dlg.copia')).slice(0,120)};S.tasks.push(c);save();$dlg.close();render();op({op:'tarefa',tarefa:c});toast(TP('toast.duplicada'))}}
  else if(a==='new')openTask(null);
  else if(a==='edit')openTask(b.dataset.id);
  else if(a==='closeDlg')$dlg.close();
  else if(a==='toggleActive'){const t=S.tasks.find(x=>x.id===b.dataset.id);t.active=!t.active;save();render();op({op:'tarefa',tarefa:t})}
  else if(a==='delTask'){if(b.dataset.arm){const t0=S.tasks.find(x=>x.id===b.dataset.id);S.tasks=S.tasks.filter(x=>x.id!==b.dataset.id);save();$dlg.close();render();op({op:'tarefa-apagar',tid:b.dataset.id});toast(TP('toast.apagada'),()=>{S.tasks.push(t0);save();render();op({op:'tarefa',tarefa:t0})})}else{b.dataset.arm=1;b.textContent=TP('dlg.confirmarApagar')}}
  else if(a==='export'){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='tarefas-porto.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  else if(a==='import')document.getElementById('file').click();
  else if(a==='clearDone'){if(b.dataset.arm){const prev={...S.done};S.done={};save();render();op({op:'limpar'});toast(TP('toast.limpas'),()=>{S.done=prev;save();render();op({op:'substituir',estado:estadoLocal()})})}else{b.dataset.arm=1;b.textContent=TP('mais.confirmarLimpar')}}
  else if(a==='reset'){if(b.dataset.arm){const p=S.people,prev=JSON.parse(JSON.stringify(estadoLocal()));S=freshState();S.people=p;save();render();op({op:'substituir',estado:estadoLocal()});toast(TP('toast.repostas'),()=>{CAMPOS.forEach(c=>{S[c]=prev[c]});save();render();op({op:'substituir',estado:estadoLocal()})})}else{b.dataset.arm=1;b.textContent=TP('mais.confirmarRepor')}}
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.act==='q'){ui.q=e.target.value;const l=document.getElementById('lista');if(l)l.innerHTML=listaHtml()}});
$dlg.addEventListener('click',e=>{const r=$dlg.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$dlg.close()});
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList?.contains('pcard')&&ui.filter===-1)ui.open[d.dataset.p]=d.open},true);
document.addEventListener('change',e=>{
  const b=e.target,a=b.dataset?.act;if(!a)return;
  if(a==='ov'){const v=Number(b.value);if(v===Number(b.dataset.def))delete S.ov[b.dataset.k];else S.ov[b.dataset.k]=v;save();render();op({op:'troca',chave:b.dataset.k,valor:S.ov[b.dataset.k]??null})}
  else if(a==='rename'){const i=Number(b.dataset.i);S.people[i]=b.value.trim()||S.people[i];save();render();enviarNome(i)}
  else if(a==='anchor'&&b.value){S.anchor=b.value;save();render();op({op:'cfg',campo:'anchor',valor:b.value})}
  else if(a==='roomsBase'&&b.value){S.roomsBase=b.value;save();render();op({op:'cfg',campo:'roomsBase',valor:b.value})}
  else if(a==='trashOn'){S.trashOn=b.checked;save();op({op:'cfg',campo:'trashOn',valor:b.checked})}
});
document.getElementById('file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());if(!Array.isArray(j.tasks)||!Array.isArray(j.people))throw 0;S={...freshState(),...j};save();render();op({op:'substituir',estado:estadoLocal()})}
  catch(_){alert(TP('mais.ficheiroInvalido'))}
  e.target.value='';
});
/* ---------- só funciona instalada no ecrã principal (telemóvel) ---------- */
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const MOVEL=IOS||/Android/.test(navigator.userAgent);
const INSTALADA=['standalone','fullscreen','minimal-ui'].some(m=>matchMedia(`(display-mode: ${m})`).matches)||navigator.standalone===true;
const LOCAL=['localhost','127.0.0.1',''].includes(location.hostname);
let pedidoInstalar=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pedidoInstalar=e;if(bloqueado)mostrarGate()});
let bloqueado=MOVEL&&!INSTALADA&&!LOCAL;
function mostrarGate(){
  const g=document.getElementById('gate');
  const vv={nomeCurto:TP('app.nomeCurto')};
  const passos=[1,2,3].map(n=>T((IOS?'gate.ios':'gate.and')+n,vv));
  g.innerHTML=`<div class="box"><img src="/icon-192.png" alt=""><h1>${T('gate.titulo')}</h1>
    <p class="lead">${T('gate.lead',{app:TP('app.nome')})}</p>
    ${pedidoInstalar?`<button class="btn pri" id="instalar">${T('gate.instalarAgora')}</button>`:''}
    <ol>${passos.map(x=>`<li><span>${x}</span></li>`).join('')}</ol>
    ${IOS?`<p class="muted" style="margin-top:14px">${T('gate.iosNota')}</p>`:''}</div>`;
  g.hidden=false;document.querySelector('.app').hidden=true;
  const bt=document.getElementById('instalar');
  if(bt)bt.onclick=async()=>{try{pedidoInstalar.prompt();await pedidoInstalar.userChoice}catch(e){}pedidoInstalar=null;mostrarGate()};
}
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('/sw.js').catch(()=>{});
/* ---------- regista o aparelho no servidor (admin) ---------- */
const DKEY='tarefas-porto-id';
function idAparelho(){try{let v=localStorage.getItem(DKEY);if(!v||!/^[A-Za-z0-9-]{8,64}$/.test(v)){v=crypto.randomUUID?crypto.randomUUID():(Date.now().toString(16)+Math.random().toString(16).slice(2)).padEnd(12,'0');localStorage.setItem(DKEY,v)}return v}catch(e){return null}}
let estadoServ='ativo',pollHello=null,ultimoHello=0;
async function hello(){
  const id=idAparelho();if(!id||!/^https?:$/.test(location.protocol)||bloqueado)return;
  ultimoHello=Date.now();
  try{const r=await fetch('/api/hello',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,pessoa:ui.filter>=0?S.people[ui.filter]:null,instalada:INSTALADA})});
    if(!r.ok)return;const j=await r.json();aplicarPessoas(j.pessoas);if(j.tv!==undefined&&j.tv!==tvSrv)carregarTextos();aplicarEstado(j.status);if(j.status==='ativo'){if(j.push===false)reenviarSubscricao();talvezPedirPush(j)}}catch(e){/* sem rede: a app continua a funcionar */}
}
// Os nomes das pessoas são do servidor: mudar num aparelho muda em todos.
function aplicarPessoas(p){
  if(!Array.isArray(p)||p.length!==3||p.every((n,i)=>n===S.people[i]))return;
  S.people=p.map(String);save();
  if(!bloqueado&&estadoServ==='ativo')renderSeguro();
}
async function enviarNome(i){
  const id=idAparelho();if(!id||!/^https?:$/.test(location.protocol))return;
  try{const r=await fetch('/api/pessoas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,i,nome:S.people[i]})});if(r.ok)aplicarPessoas((await r.json()).pessoas)}catch(e){}
}
function aplicarEstado(st){
  if(st===estadoServ)return;estadoServ=st;
  const g=document.getElementById('gate');
  clearInterval(pollHello);
  if(st==='ativo'){g.hidden=true;document.querySelector('.app').hidden=false;render();sincronizar();return}
  const pend=st==='pendente';
  g.innerHTML=`<div class="box"><img src="/icon-192.png" alt=""><h1>${T(pend?'acesso.pendenteT':'acesso.bloqueadoT')}</h1>
    <p class="lead">${T(pend?'acesso.pendenteTxt':'acesso.bloqueadoTxt')}</p>
    <button class="btn pri" id="verificar">${T('acesso.verificar')}</button></div>`;
  g.hidden=false;document.querySelector('.app').hidden=true;
  document.getElementById('verificar').onclick=hello;
  pollHello=setInterval(hello,30000);
}
/* ---------- notificações push (só com a app instalada, no iPhone) ---------- */
const PNAO='tarefas-porto-push-nao';
const pushSuportado=()=>/^https?:$/.test(location.protocol)&&'serviceWorker'in navigator&&'PushManager'in window&&'Notification'in window;
const b64uParaBytes=s=>{const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function subscricaoAtual(){
  const reg=await Promise.race([navigator.serviceWorker.ready,new Promise((_,no)=>setTimeout(no,4000))]);
  return {reg,sub:await reg.pushManager.getSubscription()};
}
async function estadoPush(){
  if(!pushSuportado())return {tipo:'semSuporte'};
  if(Notification.permission==='denied')return {tipo:'negadas'};
  try{const {sub}=await subscricaoAtual();return {tipo:sub&&Notification.permission==='granted'?'ativas':'desativadas'}}catch(e){return {tipo:'semSuporte'}}
}
async function pintarPush(){
  const e=await estadoPush(),el=document.getElementById('pushc');if(!el)return;
  const chave={semSuporte:'push.estadoSemSuporte',negadas:'push.estadoNegadas',ativas:'push.estadoAtivas',desativadas:'push.estadoDesativadas'}[e.tipo];
  el.innerHTML=`<p class="muted" style="margin:0 0 10px">${T(chave)}</p>`+(e.tipo==='ativas'?`<div class="row"><button class="btn" data-act="pushTeste">${T('push.testar')}</button><button class="btn" data-act="pushOff">${T('push.desativar')}</button></div>`:e.tipo==='desativadas'?`<button class="btn pri" data-act="pushOn">${T('push.ativar')}</button>`:'');
}
async function enviarSubscricao(sub){
  const r=await fetch('/api/push/subscrever',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:idAparelho(),sub:sub.toJSON()})});
  return r.ok;
}
async function ativarPush(){ // tem de partir de um toque (regra do iPhone)
  try{
    if(!pushSuportado())throw 0;
    if(await Notification.requestPermission()!=='granted')return false;
    const {reg,sub:existente}=await subscricaoAtual();
    const k=await (await fetch('/api/push/chave')).json();
    const sub=existente||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uParaBytes(k.chave)});
    if(!await enviarSubscricao(sub))throw 0;
    return true;
  }catch(e){toast(TP('push.erro'));return false}
}
async function desativarPush(){
  try{const {sub}=await subscricaoAtual();if(sub)await sub.unsubscribe();
    await fetch('/api/push/cancelar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:idAparelho()})})}catch(e){}
}
async function testarPush(){
  try{const r=await fetch('/api/push/teste',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:idAparelho()})});
    const j=await r.json().catch(()=>({}));toast(r.ok&&j.resultado==='ok'?TP('push.testeEnviado'):TP('push.erro'))}catch(e){toast(TP('push.erro'))}
}
let subReenviada=false;
async function reenviarSubscricao(){ // o servidor perdeu a subscrição (ou é a primeira vez neste arranque): volta a dar-lha
  if(subReenviada||!pushSuportado()||Notification.permission!=='granted')return;
  subReenviada=true;
  try{const {sub}=await subscricaoAtual();if(sub)await enviarSubscricao(sub)}catch(e){}
}
let pedidoPushMostrado=false;
async function talvezPedirPush(j){
  if(pedidoPushMostrado||!INSTALADA||!j.pushPedir||!pushSuportado()||Notification.permission!=='default')return;
  try{const t=Number(localStorage.getItem(PNAO)||0);if(t&&Date.now()-t<7*864e5)return}catch(e){}
  pedidoPushMostrado=true;
  const g=document.getElementById('gate'),app=document.querySelector('.app');
  const fechar=()=>{g.hidden=true;app.hidden=false;render()};
  g.innerHTML=`<div class="box"><img src="/icon-192.png" alt=""><h1>${T('push.pedidoT')}</h1><p class="lead">${T('push.pedidoTxt')}</p>
    <button class="btn pri" id="pushSim">${T('push.pedidoSim')}</button><button class="btn" id="pushNao" style="margin-top:10px">${T('push.pedidoNao')}</button></div>`;
  g.hidden=false;app.hidden=true;
  document.getElementById('pushSim').onclick=async()=>{await ativarPush();fechar()};
  document.getElementById('pushNao').onclick=()=>{try{localStorage.setItem(PNAO,String(Date.now()))}catch(e){}fechar()};
}
/* ---------- estado partilhado: tarefas, marcações, trocas e definições ---------- */
const CAMPOS=['tasks','done','ov','anchor','roomsBase','trashOn'];
const QKEY='tarefas-porto-fila';
let versaoSrv=-1,sincEmCurso=false,renderPendente=false,aEnviar=false,semRede=false,ultimaSync=0;
let fila=[];try{const q=JSON.parse(localStorage.getItem(QKEY)||'[]');if(Array.isArray(q))fila=q}catch(e){}
const gravarFila=()=>{try{localStorage.setItem(QKEY,JSON.stringify(fila))}catch(e){}};
const comRede=()=>/^https?:$/.test(location.protocol);
const estadoLocal=()=>Object.fromEntries(CAMPOS.map(c=>[c,S[c]]));
function renderSeguro(){ // não refaz o ecrã enquanto a pessoa escreve num campo
  const a=document.activeElement;
  if(a&&$main.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox'){renderPendente=true;return}
  render();
}
document.addEventListener('focusout',()=>{if(renderPendente){renderPendente=false;setTimeout(render,60)}});
async function chamarEstado(corpo){
  const r=await fetch('/api/estado',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:idAparelho(),...corpo})});
  return {ok:r.ok,status:r.status,j:await r.json().catch(()=>({}))};
}
// A mudança já está no ecrã. Fica numa fila guardada no aparelho e segue por ordem; sem rede espera.
function op(corpo){
  if(!comRede()||bloqueado||!idAparelho())return;
  fila.push(corpo);if(fila.length>500)fila.shift();gravarFila();
  return esvaziar();
}
async function esvaziar(){
  if(aEnviar||!fila.length)return;
  aEnviar=true;
  try{
    while(fila.length){
      let r;
      try{r=await chamarEstado(fila[0])}catch(e){semRede=true;break}
      semRede=false;
      if(r.ok){fila.shift();versaoSrv=r.j.versao===versaoSrv+1?r.j.versao:-1;gravarFila();continue}
      if(r.status===403){hello();break}
      if(r.status===409){fila=[];gravarFila();versaoSrv=-1;break} // servidor sem estado: o sincronizar lança o deste aparelho
      if(r.status===429||r.status>=500)break; // tenta mais tarde
      fila.shift();gravarFila(); // pedido recusado por ser inválido: não adianta repetir
    }
  }finally{aEnviar=false}
  if(!fila.length&&versaoSrv===-1)sincronizar();
}
async function sincronizar(){
  if(!comRede()||bloqueado||estadoServ!=='ativo'||sincEmCurso||aEnviar)return;
  if(fila.length){esvaziar();return}
  const id=idAparelho();if(!id)return;
  sincEmCurso=true;
  try{
    const r=await fetch(`/api/estado?id=${encodeURIComponent(id)}&v=${versaoSrv}`,{cache:'no-store'});
    semRede=false;
    if(r.status===403){hello();return}
    if(!r.ok)return;
    const j=await r.json();
    aplicarPessoas(j.pessoas);
    if(j.tv!==undefined&&j.tv!==tvSrv)carregarTextos();
    if(fila.length||aEnviar)return;
    ultimaSync=Date.now();
    if(j.estado===null){ // servidor vazio: este aparelho lança o estado
      const c=await chamarEstado({op:'iniciar',estado:estadoLocal()});
      versaoSrv=c.ok?c.j.versao:-1;return;
    }
    if(j.igual){versaoSrv=j.versao;return}
    CAMPOS.forEach(c=>{S[c]=j.estado[c]});save();versaoSrv=j.versao;renderSeguro();
  }catch(e){semRede=true}
  finally{sincEmCurso=false}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  if(Date.now()-ultimoHello>60000)hello();
  sincronizar();
});
setInterval(()=>{if(document.hidden)return;sincronizar();if(++ativTick%2===0&&ui.tab==='tarefas'&&ui.sub==='ativ')carregarAtividade()},5000);
if(bloqueado)mostrarGate();else{render();hello().then(sincronizar)}
</script>
